name: Validar Central de Viaturas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check js/config.js
          node --check js/theme.js
          node --check js/install.js
          node --check js/auth.js
          node --check js/data.js
          node --check js/workflow-v1411.js
          node --check js/ui-v1411.js
          node --check js/index.js
          node --check js/viatura.js
          node --check api/share.js
          node --check api/og.mjs
          node --check api/app-icon.mjs
      - name: Verificar arquivos principais
        run: |
          test -f index.html
          test -f viatura.html
          test -f css/app.css
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f js/install.js
          test -f js/workflow-v1411.js
          test -f js/ui-v1411.js
          test -f css/v1411.css
          grep -q 'workflow-v1411.js?v=1.4.13' viatura.html
          grep -q 'ui-v1411.js?v=1.4.13' viatura.html
          grep -q 'workflow-v1411.js?v=1.4.13' v.html
          grep -q 'ui-v1411.js?v=1.4.13' v.html
          grep -q 'v1411Context' js/viatura.js
          grep -q 'Valêncio SOS' manifest-viaturas-v2.webmanifest
          test -f api/app-icon.mjs
          test -f api/share.js
          test -f api/og.mjs
          test -f vercel.json
          test -f package.json
